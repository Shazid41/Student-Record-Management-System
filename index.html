
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Student Record Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdfbff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #root:empty { background: #fdfbff; height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #64748b; font-size: 14px; text-align: center; padding: 20px; }
        .error-msg { color: #ef4444; font-weight: bold; margin-top: 10px; font-family: monospace; font-size: 12px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@1.39.0",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root">
      <div>Initializing System...</div>
      <div id="error-display" class="error-msg"></div>
    </div>
    <script type="module" src="./index.tsx"></script>
    <script>
      // Global error listener to catch load failures
      window.onerror = function(msg, url, line, col, error) {
        const display = document.getElementById('error-display');
        if (display) display.innerText = 'System Error: ' + msg;
        console.error('Boot Error:', msg, error);
        return false;
      };
      
      // Safer Service Worker registration with origin check
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isGooglePreview = window.location.hostname.includes('usercontent.goog');
          const isNetlify = window.location.hostname.includes('netlify.app');
          
          if (isNetlify || window.location.hostname === 'localhost') {
            navigator.serviceWorker.register('./sw.js')
              .then(reg => console.log('Offline SW registered'))
              .catch(err => console.warn('SW registration bypassed:', err.message));
          } else if (isGooglePreview) {
            console.log('SW registration skipped for preview sandbox compatibility.');
          }
        });
      }
    </script>
</body>
</html>
